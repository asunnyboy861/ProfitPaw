name: ProfitPaw
options:
  bundleIdPrefix: com.zzoutuo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JP4TN5PTS3
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  ProfitPaw:
    type: application
    platform: iOS
    sources:
      - path: ProfitPaw
      - path: GLMProxySecret.txt
        buildPhase: resources
        optional: true
    dependencies:
      - target: ProfitPawWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.ProfitPaw
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: ProfitPaw
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID unlocks your profit dashboard."
        INFOPLIST_KEY_NSCameraUsageDescription: "ProfitPaw uses the camera to photograph supplier invoices so AI can extract item costs."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "ProfitPaw can read invoice photos from your library to extract item costs with AI."
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_ENTITLEMENTS: ProfitPaw/ProfitPaw.entitlements
  ProfitPawWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ProfitPawWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.ProfitPaw.Widget
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: ProfitPawWidget/ProfitPawWidget.entitlements
    info:
      path: ProfitPawWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
